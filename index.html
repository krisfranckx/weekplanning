<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f5f6f8" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#101217" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Weekplanning">
  <title>Weekplanning</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icoon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icoon.svg">
  <link rel="stylesheet" href="css/stijl.css">
</head>
<body>
  <header class="kop">
    <div class="kop-midden">
      <p id="subtitel"></p>
      <h1 id="titel">Vandaag</h1>
    </div>
    <div class="kop-rechts">
      <button id="deelstatus" class="deelstatus" hidden></button>
      <div class="pijlen">
        <button class="pijl" id="vorige" aria-label="Vorige" data-icoon="terug"></button>
        <button class="pijl" id="volgende" aria-label="Volgende" data-icoon="verder"></button>
      </div>
    </div>
  </header>

  <main id="inhoud" aria-live="polite"></main>

  <nav class="tabs" aria-label="Schermen">
    <button data-scherm="dag" class="actief"><span class="tab-ic" data-icoon="zon"></span>Vandaag</button>
    <button data-scherm="week"><span class="tab-ic" data-icoon="kalender"></span>Week</button>
    <button data-scherm="todo"><span class="tab-ic" data-icoon="vinkje"></span>Todo's</button>
    <button data-scherm="gezin"><span class="tab-ic" data-icoon="gezin"></span>Gezin</button>
  </nav>

  <dialog id="blad" class="blad">
    <form method="dialog" id="blad-form"></form>
  </dialog>

  <div id="melding" class="melding" role="status" hidden></div>

  <script src="js/logica.js"></script>
  <script src="js/iconen.js"></script>
  <script src="js/agenda.js"></script>
  <script src="js/afval.js"></script>
  <script src="js/sync.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
